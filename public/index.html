<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PipelineIQ | Monitoring</title><style>
:root{font-family:system-ui,sans-serif;color:#edf3ff;background:#0b1322}*{box-sizing:border-box}body{margin:0}header{padding:22px 5%;border-bottom:1px solid #34455e;display:flex;justify-content:space-between}main{max-width:1150px;margin:auto;padding:24px}h1{margin:0;font-size:25px}h2{font-size:18px}.muted,small{color:#a9bad3}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.panels{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}.card,.panel{background:#142238;border:1px solid #30435f;border-radius:13px;padding:20px}.metric{font-size:32px;font-weight:700}button,input{font:inherit;background:#1d3451;color:white;border:1px solid #4b6585;border-radius:7px;padding:10px}button{cursor:pointer}.item{width:100%;display:flex;justify-content:space-between;margin:6px 0;text-align:left}.healthy{color:#71e4ac}.failed{color:#ff9999}.blocked{color:#ffd37e}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0c182a;padding:12px;border-radius:8px}input{width:100%}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.panels{grid-template-columns:1fr}}
</style></head><body><header><div><h1>◈ PipelineIQ</h1><small>Data pipeline health & troubleshooting</small></div><small>SYNTHETIC DEMO</small></header><main><div class="grid" id="metrics"></div><div class="panels"><section class="panel"><h2>Pipeline health</h2><div id="pipelines">Loading…</div></section><section class="panel"><h2>Evidence-based diagnosis</h2><div id="diagnosis">Select a pipeline</div></section><section class="panel"><h2>Search logs</h2><input id="search" placeholder="Search timeout, null…" aria-label="Search logs"><div id="logs"></div></section><section class="panel"><h2>Dependencies</h2><div id="dependencies"></div></section></div><p class="muted">Fictional data only. Recommendations are unverified and require human approval. No automated repair.</p></main><script>
const el=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path){let r=await fetch(path);if(!r.ok)throw Error("Request failed");return r.json()}
async function diagnose(id){try{let d=await api("/api/diagnose/"+encodeURIComponent(id));el("diagnosis").innerHTML="<h3>"+esc(d.cause)+"</h3><p>"+esc(d.recommendation)+"</p><small>Evidence log IDs: "+esc(d.evidence_log_ids.join(", ")||"None")+" | Unverified | Human approval required</small>"}catch(e){el("diagnosis").textContent="Diagnosis unavailable"}}
async function logs(){try{let rows=await api("/api/logs?q="+encodeURIComponent(el("search").value));el("logs").innerHTML=rows.length?rows.map(r=>"<pre>"+esc(r.level)+" #"+r.id+" "+esc(r.pipeline_id)+"\n"+esc(r.message)+"</pre>").join(""):"No matching logs"}catch(e){el("logs").textContent="Unable to load logs"}}
async function init(){try{let p=await api("/api/pipelines");let c={healthy:0,failed:0,blocked:0};p.forEach(x=>{if(x.status in c)c[x.status]++});el("metrics").innerHTML=[["Total",p.length],["Healthy",c.healthy],["Failed",c.failed],["Blocked",c.blocked]].map(([k,v])=>'<div class="card"><div class="muted">'+k+'</div><div class="metric">'+v+'</div></div>').join("");el("pipelines").innerHTML=p.map(x=>'<button class="item" data-id="'+esc(x.id)+'"><span>'+esc(x.name)+'</span><span class="'+esc(x.status)+'">'+esc(x.status)+'</span></button>').join("");el("pipelines").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>diagnose(b.dataset.id)));el("dependencies").innerHTML=p.map(x=>"<p><b>"+esc(x.name)+"</b><br><small>Upstream: "+esc(x.depends_on.join(", ")||"None")+"</small></p>").join("");await logs();await diagnose("customers_transform")}catch(e){el("pipelines").textContent="Unable to load dashboard"}}
el("search").addEventListener("input",logs);init();
</script></body></html>
