name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python source
        run: python -m compileall -q calculator.py tests
      - name: Run sample program
        run: python calculator.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
